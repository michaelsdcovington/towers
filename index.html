<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>towers</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  pre { margin: 0; color: #ddd; font-family: monospace; font-size: 16px; line-height: 1.2; white-space: pre; }
  #measure { position: absolute; visibility: hidden; }
</style>
</head>
<body>
<pre id="screen"></pre>
<pre id="measure"><span>M</span></pre>

<script>
// ---------- ncurses replacement: stdscr is a grid of characters ----------
const out = document.getElementById("screen");
const cell = document.querySelector("#measure span").getBoundingClientRect();

const LINE_HEIGHT = 18;

// getmaxyx(stdscr, height, width)
const width = Math.floor(window.innerWidth / cell.width);
const height = Math.floor(window.innerHeight / LINE_HEIGHT);

let stdscr = newGrid();

function newGrid() {
  return Array.from({ length: height }, () => Array(width).fill(" "));
}
function mvprintw(row, col, str) {
  for (let k = 0; k < str.length; k++) {
    const c = col + k;
    if (row >= 0 && row < height && c >= 0 && c < width) stdscr[row][c] = str[k];
  }
}
function erase() { stdscr = newGrid(); }
function refresh() { out.textContent = stdscr.map(r => r.join("")).join("\n"); }
function endwin() { document.removeEventListener("keydown", onKey); }

// ---------- program ----------
function draw(row, col, character) {
  mvprintw(row, col, character);
}

function creds(height, width) {
  mvprintw(height - 6, width - 30, "towers");
  mvprintw(height - 5, width - 30, "q to quit, n to generate");
  mvprintw(height - 4, width - 30, "created by michael covington");
}
function hidecreds(height, width) {
  mvprintw(height - 6, width - 30, "              ");
  mvprintw(height - 5, width - 30, "                            ");
  mvprintw(height - 4, width - 30, "                            ");
}

let refreshuh = 0, showcreds = 1;
const middle = Math.floor(width / 2) + 1;
const branches = Array.from({ length: height }, () => Array(width).fill(" "));

mvprintw(height - 7, width - 30, "h to hide this");
creds(height, width);
refresh(); // getch() refreshes pending changes in ncurses

// while((ch = getch()) != 'q'){ ... }  ->  one call per key press
function onKey(e) {
  const ch = e.key;
  if (ch === "q") {
    endwin();
    return;
  }

  if (ch === "n") {
    // memset(branches, ' ', sizeof branches);
    for (let i = 0; i < height; i++) branches[i].fill(" ");

    const e2 = Math.floor(Math.random() * 3);
    switch (e2) {
      case 0:
        branches[0][middle] = "^";
        break;
      case 1:
        branches[0][middle] = "/";
        break;
      case 2:
        branches[0][middle] = "\\";
        break;
    }
    // branches[0][34] = '^';
    erase();
    refreshuh = 1;
    for (let i = 0; i < height; i++) {
      for (let j = 0; j < width; j++) {
        const r = Math.floor(Math.random() * 3);
        if (j === width - 1) {
          break;
        }
        else if (i === height - 1) {
          break;
        }
        else if (branches[i][j] === "^") {
          if (r === 0) {
            branches[i + 1][j - 1] = "/";
            branches[i + 1][j + 1] = "\\";
          }
          else if (r === 1) {
            branches[i + 1][j - 1] = "/";
            branches[i + 1][j + 1] = "^";
          }
          else if (r === 2) {
            branches[i + 1][j - 1] = "^";
            branches[i + 1][j + 1] = "\\";
          }
        }
        else if (branches[i][j] === "/") {
          if (r === 1) {
            branches[i + 1][j - 1] = "/";
          }
          else if (r === 2) {
            branches[i + 1][j] = "^";
          }
          else {
            branches[i + 1][j] = "\\";
          }
        }
        else if (branches[i][j] === "\\") {
          if (r === 0) {
            branches[i + 1][j + 1] = "\\";
          }
          else if (r === 2) {
            branches[i + 1][j] = "^";
          }
          else {
            branches[i + 1][j] = "/";
          }
        }
      }
    }
    for (let i = 0; i < height; i++) {
      for (let j = 0; j < width; j++) {
        if (branches[i][j] === "/" || branches[i][j] === "\\" || branches[i][j] === "^") {
          draw(i, j, branches[i][j]);
        }
      }
    }
  }

  if (refreshuh) {
    refresh();
    refreshuh = 0;
  }
  if (showcreds) {
    creds(height, width);
  }
  if (ch === "h") {
    hidecreds(height, width);
    if (showcreds) {
      showcreds = 0;
    }
    else {
      creds(height, width);
      showcreds = 1;
    }
  }

  refresh(); // getch() refreshes pending changes in ncurses
}

document.addEventListener("keydown", onKey);
</script>
</body>
</html>
